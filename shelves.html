<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Your Shelfwise shelves: books you want to read, are reading, and have finished.">
  <title>My Shelves | Shelfwise</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%9A%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/header.css">
  <link rel="stylesheet" href="css/footer.css">
  <link rel="stylesheet" href="css/shelves.css">
  <script type="module" src="js/main.js"></script>
</head>
<body data-page="shelves">
  <a class="skip-link" href="#main">Skip to main content</a>

  <header class="site-header">
    <div class="container header-inner">
      <a class="logo" href="index.html">
        <span class="logo-mark" aria-hidden="true">📚</span>
        <span class="logo-text">Shelfwise</span>
      </a>
      <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="main-nav">
        <span class="nav-toggle-icon" aria-hidden="true"><span></span><span></span><span></span></span>
        <span class="visually-hidden">Menu</span>
      </button>
      <nav aria-label="Main">
        <ul class="nav-list" id="main-nav">
          <li><a href="index.html">Search</a></li>
          <li><a href="shelves.html" aria-current="page">My Shelves</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main id="main" class="container">
    <div class="shelves-header">
      <h1 tabindex="-1">My Shelves</h1>
      <!-- Filter reads/writes ?shelf= in the URL, e.g. shelves.html?shelf=finished -->
      <div class="field field-inline">
        <label for="shelf-filter">Show</label>
        <select id="shelf-filter" name="shelf">
          <option value="all">All books</option>
          <option value="to-read">Want to Read</option>
          <option value="reading">Currently Reading</option>
          <option value="finished">Finished</option>
        </select>
      </div>
    </div>

    <!-- Counts and cards are built from localStorage (storage.js + ui.js) -->
    <ul class="shelf-stats" aria-label="Shelf totals"></ul>

    <ul class="shelf-list" aria-label="Saved books"></ul>
    <p id="shelf-status" class="visually-hidden" role="status"></p>

    <div class="empty-state" hidden>
      <p>No books here yet.</p>
      <a class="btn btn-primary" href="index.html">Find a book</a>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <p>&copy; 2026 Shelfwise · Sam Smoot &amp; Michelle Olsen · WDD 231</p>
      <p>Book data from <a href="https://openlibrary.org">Open Library</a></p>
    </div>
  </footer>
</body>
</html>
