<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Book details and add-to-shelf form on Shelfwise.">
  <title>Book Details | Shelfwise</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/book.css">
  <link rel="stylesheet" href="css/notify.css">
  <script type="module" src="js/main.js"></script>
</head>
<body data-page="book">
  <a class="skip-link" href="#main">Skip to main content</a>

  <header class="site-header">
    <div class="container header-inner">
      <a class="logo" href="index.html">
        <span class="logo-mark" aria-hidden="true">📚</span>
        <span class="logo-text">Shelfwise</span>
      </a>
      <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="main-nav">
        <span class="nav-toggle-icon" aria-hidden="true"><span></span><span></span><span></span></span>
        <span class="visually-hidden">Menu</span>
      </button>
      <nav aria-label="Main">
        <ul class="nav-list" id="main-nav">
          <li><a href="index.html">Search</a></li>
          <li><a href="shelves.html">My Shelves</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main id="main" class="container">
    <p class="back-link"><a href="index.html">&larr; Back to search</a></p>

    <!-- main.js reads ?id= from the URL, fetches that work from Open Library,
         and ui.js fills in this article -->
    <article class="book-detail" aria-live="polite">
      <p class="message message-loading"><span class="spinner" aria-hidden="true"></span>Loading book…</p>
    </article>

    <section class="shelf-form-section" aria-labelledby="form-heading" hidden>
      <h2 id="form-heading">Add to my shelf</h2>
      <p class="form-intro">Fields marked <span class="req" aria-hidden="true">*</span> are required.</p>

      <!-- form.js validates on submit, storage.js saves to localStorage -->
      <form id="shelf-form" class="shelf-form" novalidate>
        <input type="hidden" name="bookId" value="">

        <div class="field">
          <label for="shelf">Shelf <span class="req" aria-hidden="true">*</span></label>
          <select id="shelf" name="shelf" required aria-describedby="shelf-error">
            <option value="">Choose a shelf…</option>
            <option value="to-read">Want to Read</option>
            <option value="reading">Currently Reading</option>
            <option value="finished">Finished</option>
          </select>
          <p class="error-msg" id="shelf-error" aria-live="polite"></p>
        </div>

        <!-- form.js shows or hides the rating and date fields based on the shelf chosen above -->
        <fieldset class="field rating-field" data-shelf-field hidden>
          <legend>Your rating</legend>
          <div class="rating-options">
            <input type="radio" id="rate-1" name="rating" value="1"><label for="rate-1">1</label>
            <input type="radio" id="rate-2" name="rating" value="2"><label for="rate-2">2</label>
            <input type="radio" id="rate-3" name="rating" value="3"><label for="rate-3">3</label>
            <input type="radio" id="rate-4" name="rating" value="4"><label for="rate-4">4</label>
            <input type="radio" id="rate-5" name="rating" value="5"><label for="rate-5">5</label>
          </div>
          <p class="hint">1 = didn't like it, 5 = loved it</p>
        </fieldset>

        <div class="field-row">
          <div class="field" id="started-field" data-shelf-field hidden>
            <label for="date-started">Date started</label>
            <input type="date" id="date-started" name="dateStarted" aria-describedby="started-error started-hint">
            <p class="hint" id="started-hint"></p>
            <p class="error-msg" id="started-error" aria-live="polite"></p>
          </div>
          <div class="field" id="finished-field" data-shelf-field hidden>
            <label for="date-finished">Date finished</label>
            <input type="date" id="date-finished" name="dateFinished" aria-describedby="finished-error">
            <p class="error-msg" id="finished-error" aria-live="polite"></p>
          </div>
        </div>

        <div class="field">
          <label for="notes">Notes</label>
          <textarea id="notes" name="notes" rows="4" maxlength="500" aria-describedby="notes-error notes-count"></textarea>
          <p class="hint" id="notes-count">0 / 500 characters</p>
          <p class="error-msg" id="notes-error" aria-live="polite"></p>
        </div>

        <div class="field checkbox-field">
          <input type="checkbox" id="favorite" name="favorite">
          <label for="favorite">Mark as a favorite</label>
        </div>

        <button type="submit" class="btn btn-primary">Save to shelf</button>
      </form>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <p>&copy; 2026 Shelfwise · Sam Smoot &amp; Michelle Olsen · WDD 231</p>
      <p>Book data from <a href="https://openlibrary.org">Open Library</a></p>
    </div>
  </footer>
</body>
</html>
